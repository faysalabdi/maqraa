name: ios-ota
run-name: "OTA to ${{ inputs.channel }}: ${{ inputs.message }}"

# Ships a JavaScript-only change straight to installed apps, no review queue.
#
# This can NOT ship native changes — a new package, anything touching app.json's
# plugins, icons or permissions, or an SDK bump. Those need ios-release.
#
# An update only reaches builds with the same runtimeVersion, which is the app
# version (policy "appVersion" in app.json). Bump `version` and existing
# installs stop receiving updates until they take a new build.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to publish to
        type: choice
        options:
          - preview
          - production
        default: preview
      message:
        description: What changed (shown in the EAS dashboard)
        type: string
        required: true

concurrency:
  group: ios-ota-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      # An OTA update reaches real devices immediately and cannot be reviewed
      # on the way, so the guards matter more here than on a build.
      - name: Typecheck the mobile app
        run: pnpm typecheck
        working-directory: mobile

      - name: Lint the mobile app for hook-order bugs
        run: pnpm lint:mobile

      - name: Test the shared logic
        run: pnpm test

      - name: Fail early if EXPO_TOKEN is missing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set on this repository."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish the update
        working-directory: mobile
        env:
          MESSAGE: ${{ inputs.message }}
        run: eas update --channel ${{ inputs.channel }} --message "$MESSAGE" --non-interactive
